<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>calendar</title>
<style>
  :root { --text: #d4d4d4; --muted: #8a8f98; --accent: #5b6fd6; --line: #3a3f4b; }
  :root { color-scheme: dark; }
  html, body { margin: 0; background: transparent; color: var(--text);
    font: 12px/1.4 ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace; }
  .wrap { max-width: 260px; margin: 0 auto; padding: 8px 6px; }
  .head { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
  .month { font-weight: 600; letter-spacing: .02em; }
  .ctrl { display: flex; justify-content: center; margin-bottom: 8px; }
  button { font: inherit; font-size: 11px; color: var(--text); background: transparent; border: 1px solid var(--line);
    padding: 1px 8px; cursor: pointer; }
  button + button { border-left: 0; }
  button:hover { color: #fff; border-color: var(--accent); }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { color: var(--muted); font-weight: 500; font-size: 10px; padding: 3px 0; border: 1px solid var(--line); }
  td { text-align: center; padding: 4px 0; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  td.out { color: #555a64; }
  td.today span { display: inline-block; width: 18px; height: 18px; line-height: 18px; border-radius: 50%;
    background: var(--text); color: #0d0d0f; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><span class="month" id="m"></span><span id="y" style="color:var(--muted)"></span></div>
  <div class="ctrl">
    <button id="prev" aria-label="Previous month">‹</button><button id="today">Today</button><button id="next" aria-label="Next month">›</button>
  </div>
  <table aria-label="Month calendar"><thead><tr id="dow"></tr></thead><tbody id="grid"></tbody></table>
</div>
<script>
(() => {
  const bg = new URLSearchParams(location.search).get("bg");
  if (bg && /^[0-9a-fA-F]{3,8}$/.test(bg)) document.body.style.background = "#" + bg;

  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  document.getElementById("dow").innerHTML = DOW.map(d => `<th scope="col">${d}</th>`).join("");
  let view = new Date(); view.setDate(1);

  function render() {
    const now = new Date();
    const y = view.getFullYear(), m = view.getMonth();
    document.getElementById("m").textContent = view.toLocaleString("en-US", { month: "long" }).toLowerCase();
    document.getElementById("y").textContent = y;
    const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    let html = "";
    for (let w = 0; w < 6; w++) {
      html += "<tr>";
      for (let d = 0; d < 7; d++) {
        const day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + d);
        const isToday = day.toDateString() === now.toDateString();
        const cls = [day.getMonth() !== m ? "out" : "", isToday ? "today" : ""].join(" ").trim();
        const n = String(day.getDate()).padStart(2, "0");
        html += `<td class="${cls}"${isToday ? ' aria-current="date"' : ""}>${isToday ? `<span>${n}</span>` : n}</td>`;
      }
      html += "</tr>";
      if (w >= 4 && new Date(start.getFullYear(), start.getMonth(), start.getDate() + (w + 1) * 7).getMonth() !== m) break;
    }
    document.getElementById("grid").innerHTML = html;
  }
  document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
  document.getElementById("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
  document.getElementById("today").onclick = () => { view = new Date(); view.setDate(1); render(); };
  render();
  setInterval(render, 60 * 60 * 1000);
})();
</script>
</body>
</html>
