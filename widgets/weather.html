<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weather</title>
<style>
  :root { --text: #d4d4d4; --muted: #8a8f98; --accent: #5b6fd6; --line: #3a3f4b; }
  html, body { margin: 0; background: transparent; color: var(--text);
    font: 12px/1.4 ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 6px 8px; }
  .now { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-bottom: 12px; }
  .place { text-align: right; text-transform: lowercase; }
  .place b { display: block; font-weight: 600; letter-spacing: .04em; }
  .place span, .cond, .day .lo, .msg { color: var(--muted); }
  .temp { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .days { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; gap: 4px; }
  .day .name { text-transform: lowercase; margin-bottom: 2px; }
  .day .hi, .day .lo { font-size: 11px; font-variant-numeric: tabular-nums; }
  canvas { image-rendering: pixelated; display: block; margin: 2px auto; }
  .msg { text-align: center; padding: 10px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">loading weather…</div></div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const bg = q.get("bg");
  if (bg && /^[0-9a-fA-F]{3,8}$/.test(bg)) document.body.style.background = "#" + bg;
  const lat = parseFloat(q.get("lat") ?? "30.2849"), lon = parseFloat(q.get("lon") ?? "-97.7341");
  const name = (q.get("name") || "austin").slice(0, 32);

  // 12x12 pixel icons. . = empty, s = sun, c = cloud, d = dark cloud, r = rain, w = snow, b = bolt
  const COL = { s: "#e8ecff", c: "#a9c4ff", d: "#5b6fd6", r: "#3fb8af", w: "#e8ecff", b: "#e8ecff" };
  const ICONS = {
    sun: ["............", ".....s......", "..s..s..s...", "...s.s.s....", "....sss.....", "sssss.sssss.",
          "....sss.....", "...s.s.s....", "..s..s..s...", ".....s......", "............", "............"],
    partly: ["............", "..s.s.......", "...sss......", ".ssss.......", "...scccc....", "..ccccccc...",
             ".ccccccccc..", "cccccccccccc", ".cccccccccc.", "............", "............", "............"],
    cloud: ["............", "............", "....cccc....", "...cccccc...", "..cccccccc..", ".cccccccccc.",
            "cccccccccccc", "cccccccccccc", ".cccccccccc.", "............", "............", "............"],
    fog: ["............", "............", ".cccccccccc.", "............", "..cccccccccc", "............",
          "cccccccccc..", "............", ".cccccccccc.", "............", "............", "............"],
    rain: ["............", "....dddd....", "...dddddd...", "..dddddddd..", ".dddddddddd.", "dddddddddddd",
           ".dddddddddd.", "............", "..r..r..r...", ".r..r..r....", "............", "............"],
    snow: ["............", "....cccc....", "...cccccc...", "..cccccccc..", ".cccccccccc.", "cccccccccccc",
           ".cccccccccc.", "............", "..w...w...w.", "............", ".w...w...w..", "............"],
    storm: ["............", "....dddd....", "...dddddd...", "..dddddddd..", ".dddddddddd.", "dddddddddddd",
            ".ddddbddddd.", ".....bb.....", "....bb......", "...bbbb.....", ".....b......", "....b......."]
  };
  function kind(code) {
    if (code === 0) return ["sun", "clear"];
    if (code <= 2) return ["partly", "partly cloudy"];
    if (code === 3) return ["cloud", "overcast"];
    if (code <= 48) return ["fog", "fog"];
    if (code <= 57) return ["rain", "drizzle"];
    if (code <= 67) return ["rain", code >= 65 ? "heavy rain" : "light rain"];
    if (code <= 77) return ["snow", "snow"];
    if (code <= 82) return ["rain", "showers"];
    if (code <= 86) return ["snow", "snow showers"];
    return ["storm", "thunderstorm"];
  }
  function icon(key, scale) {
    const c = document.createElement("canvas");
    c.width = c.height = 12 * scale;
    c.setAttribute("aria-hidden", "true");
    const g = c.getContext("2d");
    ICONS[key].forEach((row, y) => [...row].forEach((p, x) => {
      if (p !== ".") { g.fillStyle = COL[p]; g.fillRect(x * scale, y * scale, scale, scale); }
    }));
    return c;
  }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
    "&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min" +
    "&temperature_unit=fahrenheit&timezone=auto&forecast_days=6";

  async function load() {
    const app = document.getElementById("app");
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      const [key, label] = kind(d.current.weather_code);
      const now = el("div", "now");
      const place = el("div", "place"); place.append(el("b", null, name), el("span", null, "weather"));
      const right = el("div"); right.append(el("div", "temp", Math.round(d.current.temperature_2m) + " °F"), el("div", "cond", label));
      now.append(place, icon(key, 3), right);
      const days = el("div", "days");
      for (let i = 1; i <= 5; i++) {
        const date = new Date(d.daily.time[i] + "T12:00:00");
        const day = el("div", "day");
        day.append(el("div", "name", date.toLocaleDateString("en-US", { weekday: "short" })),
          icon(kind(d.daily.weather_code[i])[0], 2),
          el("div", "hi", Math.round(d.daily.temperature_2m_max[i]) + " °F"),
          el("div", "lo", Math.round(d.daily.temperature_2m_min[i]) + " °F"));
        days.append(day);
      }
      app.replaceChildren(now, days);
    } catch (e) {
      app.replaceChildren(el("div", "msg", "weather unavailable — retrying soon"));
    }
  }
  load();
  setInterval(load, 30 * 60 * 1000);
})();
</script>
</body>
</html>
