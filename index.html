<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metagross</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  #bubble {
    position: absolute; top: 4px; max-width: 220px; padding: 5px 9px;
    font: italic 13px/1.3 Georgia, "Times New Roman", serif;
    color: #f1e6cc; background: #3b2a1c; border: 1px solid #8a6a44; border-radius: 6px;
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  #bubble.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c" aria-label="Metagross walking. Click for a study tip." role="img"></canvas>
<div id="bubble" aria-live="polite"></div>
<script>
(() => {
  // ---- Settings you can change ----------------------------------------------
  const SPRITE = "metagross.png"; // any transparent PNG in this folder
  const HEIGHT = 56;        // sprite height in CSS px
  const WALK_SPEED = 22;    // CSS px per second
  const LINES = [
    "One page at a time.",
    "Check your Next 7 days.",
    "Tea break earned.",
    "Small steps still count.",
    "Start with the hardest five minutes.",
    "Overdue? Reschedule or do it.",
    "Read the rubric twice.",
    "Water, then work.",
    "Close a tab. Open a book.",
    "Future you says thanks.",
    "Done is better than perfect.",
    "Sunday review keeps Monday calm.",
    "Four brains, one problem set.",
    "Write it down so you can let it go.",
    "Sleep is part of studying.",
    "You know more than yesterday.",
    "Ask the question in office hours."
  ];

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const bubble = document.getElementById("bubble");
  const params = new URLSearchParams(location.search);
  const bg = params.get("bg");
  if (bg && /^[0-9a-fA-F]{3,8}$/.test(bg)) document.body.style.background = "#" + bg;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const img = new Image();
  img.src = SPRITE;
  let SW = HEIGHT; // sprite width, set once the image loads

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }
  addEventListener("resize", resize);
  resize();

  const mg = {
    x: reduced ? 24 : Math.random() * Math.max(1, W - SW),
    dir: 1, state: "walk", timer: 2 + Math.random() * 4,
    t: 0, hopT: -1
  };

  function pickNext() {
    if (reduced) { mg.state = "idle"; mg.timer = 6; return; }
    const r = Math.random();
    if (mg.state !== "walk" && r < 0.6) { mg.state = "walk"; mg.timer = 3 + Math.random() * 6; if (Math.random() < 0.3) mg.dir *= -1; }
    else if (r < 0.85) { mg.state = "idle"; mg.timer = 1.5 + Math.random() * 3; }
    else { mg.state = "idle"; mg.timer = 1.2; mg.hopT = 0; }
  }

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    mg.t += dt;

    mg.timer -= dt;
    if (mg.timer <= 0) pickNext();

    if (mg.state === "walk") {
      mg.x += mg.dir * WALK_SPEED * dt;
      const maxX = Math.max(0, W - SW);
      if (mg.x <= 0) { mg.x = 0; mg.dir = 1; }
      if (mg.x >= maxX) { mg.x = maxX; mg.dir = -1; }
    }

    // heavy four-legged stomp while walking, slow hover bob while idle
    let lift = 0, tilt = 0;
    if (!reduced) {
      if (mg.state === "walk") {
        lift = Math.abs(Math.sin(mg.t * 6)) * 2;
        tilt = Math.sin(mg.t * 6) * 0.03 * mg.dir;
      } else {
        lift = (Math.sin(mg.t * 2) + 1) * 1.5;
      }
    }
    if (mg.hopT >= 0 && !reduced) {
      mg.hopT += dt;
      const k = mg.hopT / 0.45;
      if (k >= 1) mg.hopT = -1; else lift += Math.sin(k * Math.PI) * 10;
    }

    ctx.clearRect(0, 0, W, H);
    const y = Math.max(0, H - HEIGHT - 2) - lift;
    if (img.complete && img.naturalWidth) {
      ctx.save();
      ctx.translate(mg.x + SW / 2, y + HEIGHT);
      ctx.rotate(tilt);
      if (mg.dir < 0) ctx.scale(-1, 1);
      ctx.drawImage(img, -SW / 2, -HEIGHT, SW, HEIGHT);
      ctx.restore();
    }
    placeBubble(y);
    requestAnimationFrame(tick);
  }

  let bubbleTimer = 0;
  function placeBubble(y) {
    if (!bubble.classList.contains("show")) return;
    const bw = bubble.offsetWidth;
    const right = mg.x + SW + 6;
    const left = mg.x - bw - 6;
    bubble.style.left = (right + bw <= W || left < 0 ? Math.min(right, Math.max(0, W - bw)) : left) + "px";
    bubble.style.top = Math.max(2, y + 4) + "px";
  }

  canvas.addEventListener("click", (ev) => {
    const rect = canvas.getBoundingClientRect();
    const mx = ev.clientX - rect.left;
    if (mx < mg.x - 10 || mx > mg.x + SW + 10) return;
    bubble.textContent = LINES[Math.floor(Math.random() * LINES.length)];
    bubble.classList.add("show");
    if (!reduced) mg.hopT = 0;
    mg.state = "idle"; mg.timer = 3;
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove("show"), 3000);
  });

  img.onload = () => {
    SW = HEIGHT * img.naturalWidth / img.naturalHeight;
    mg.x = Math.min(mg.x, Math.max(0, W - SW));
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
